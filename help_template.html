<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AstrBot 帮助文档</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f8fafc;
            color: #2c3e50;
            font-size: 26px;
            line-height: 1.85;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* 顶部标题 —— 彩虹彩色无限循环 */
        .header {
            background: linear-gradient(90deg,
                #ff6b6b, #feca57, #48dbfb, #1dd1a1, #5f27cd, #ff9ff3, #ff6b6b
            );
            background-size: 600% 600%;
            animation: rainbowFlow 12s ease infinite;
            color: #fff;
            font-size: 40px;
            font-weight: 700;
            text-align: center;
            padding: 32px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 彩虹彩色循环动画 */
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主体内容 */
        .content {
            padding: 40px;
            background: #f8fafc;
        }

        /* 插件分组 */
        .plugin-group {
            margin-bottom: 40px;
            animation: slideUp 0.5s ease;
            animation-fill-mode: both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .plugin-header {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
            position: relative;
            overflow: hidden;
        }

        .plugin-header h2 {
            font-size: 22px;
            color: #1e3a8a;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .plugin-header h2::before {
            content: '📦';
            font-size: 24px;
        }

        .command-count {
            background: #3b82f6;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 12px;
        }

        /* 命令卡片网格 */
        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 10px;
        }

        .command-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .command-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .command-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        .command-card:hover::before {
            transform: scaleY(1);
        }

        .command-name {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .command-name::before {
            content: '⚡';
            font-size: 14px;
            opacity: 0.7;
        }

        .command-desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        /* 特殊样式 */
        .plugin-group.special .plugin-header {
            background: linear-gradient(135deg, #fed7aa 0%, #ffedd5 100%);
            border-left-color: #f59e0b;
        }

        .plugin-group.special .plugin-header h2::before {
            content: '⭐';
        }

        /* 底部 */
        .footer {
            background: white;
            padding: 20px 40px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .container {
                margin: 0;
            }

            .content {
                padding: 30px;
            }

            .commands-grid {
                grid-template-columns: 1fr;
            }

            .plugin-header h2 {
                font-size: 18px;
            }
        }


    </style>
</head>
<body>
    <div class="header">
        {{ header_title }}
    </div>
    
    <div class="container">
        <!-- 内容 -->
        <div class="content">
            {% for section in sections %}
            <div class="plugin-group 
                {% if '指令' in section.name %}special
                {% endif %}">
                <div class="plugin-header">
                    <h2>
                        {{ section.name }}
                        <span class="command-count">{{ section.commands|length }}个命令</span>
                    </h2>
                </div>
                <div class="commands-grid">
                    {% for cmd in section.commands %}
                    <div class="command-card">
                        <div class="command-name">{{ cmd.name }}</div>
                        {% if cmd.desc %}
                        <div class="command-desc">{{ cmd.desc }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            <div>{{ footer_text }}</div>
            {% if version %}
            <div style="margin-top: 8px;">AstrBot v{{ version }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
